name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validate-nextjs:
    name: Build & Validate Next.js
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: next-app
        run: npm install --prefer-offline --no-audit

      - name: Build Next.js Application
        working-directory: next-app
        run: npm run build

  validate-tinker:
    name: Validate Python Tinker Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Syntax & Pipeline Verification
        run: |
          python -m py_compile server.py
          python -m py_compile tinker/train_tinker.py
          python -m py_compile tinker/evaluate_benchmark.py
          python -m py_compile tinker/dataset.py
